[workspace]
resolver = "3"
members = ["core/pulley-core", "core/pulley-wasm", "bridge", "xtask"]
# cargo-fuzz targets: their own workspace (nightly + libFuzzer), see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
authors = ["Haneesh Raj Banisetti"]
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
pulley-core = { path = "core/pulley-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["float_roundtrip", "raw_value"] }
roxmltree = "0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# WebAssembly build (cargo xtask wasm): small and panic=abort.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
