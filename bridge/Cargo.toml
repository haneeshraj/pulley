[package]
name = "pulley-bridge"
description = "Pulley bridge: local WebSocket hub between Illustrator, Figma and After Effects."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "pulley-bridge"
path = "src/main.rs"

[dependencies]
pulley-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Async runtime for the WebSocket server.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# WebSocket server; its handshake callback lets us check Host and Origin before upgrading.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Per-user config/log directories.
directories = "6"
# OS randomness for the session token, pairing codes and Figma secrets.
getrandom = "0.4"
# Logging with daily rotating files.
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std", "ansi"] }
tracing-appender = "0.2"
# Tray / menu bar icon and its event loop (macOS needs the main thread).
tray-icon = "0.26"
tao = "0.37"
# Decoding the generated tray icon PNGs.
png = "0.18"
# Optional launch at login (Windows Run key / macOS LaunchAgent).
auto-launch = "0.6"

[dev-dependencies]
directories = "6"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true

[build-dependencies]
serde_json.workspace = true

# Installers (cargo-packager): NSIS on Windows, .app + .dmg on macOS.
# Built by tools/package-bridge.mjs, which also signs when certificates are configured.
[package.metadata.packager]
product-name = "Pulley"
identifier = "dev.pulley.bridge"
publisher = "Haneesh Raj Banisetti"
copyright = "Copyright (c) 2026 Haneesh Raj Banisetti"
# The installer shows the license and installs it next to the app.
license-file = "../LICENSE"
resources = ["../LICENSE"]
category = "GraphicsAndDesign"
out-dir = "../dist/installers"
binaries = [{ path = "pulley-bridge", main = true }]
icons = ["../assets/icons/out/bridge/app.ico", "../assets/icons/out/bridge/app.icns", "../assets/icons/out/bridge/app-256.png"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
header-image = "../assets/icons/out/installer/nsis-header.bmp"
sidebar-image = "../assets/icons/out/installer/nsis-sidebar.bmp"
installer-icon = "../assets/icons/out/installer/setup.ico"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# A menu bar app: no Dock icon.
background-app = true

[package.metadata.packager.dmg]
background = "../assets/icons/out/installer/dmg-background.png"
window-size = { width = 660, height = 400 }
app-position = { x = 180, y = 220 }
application-folder-position = { x = 480, y = 220 }
