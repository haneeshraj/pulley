<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulley</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="status" id="status" data-state="disconnected">
    <div class="row">
      <span class="dot"></span>
      <span class="text grow" id="stateText">Not connected</span>
      <button class="icon" id="reconnect" title="Reconnect" data-icon="ui.reconnect"></button>
      <button class="icon" id="settingsBtn" title="Settings" data-icon="ui.settings"></button>
      <button class="icon" id="logBtn" title="Show the bridge log" data-icon="ui.open-log"></button>
    </div>
    <div class="detail" id="detail"></div>
    <div class="apps" id="apps"></div>
  </div>

  <button class="primary" id="push" data-icon="ui.push">Push to After Effects</button>
  <div class="muted section" id="selection"></div>

  <div class="section hidden" id="busy">
    <div class="row"><span class="grow muted" id="stage"></span><button id="cancel" data-icon="ui.cancel">Cancel</button></div>
    <div class="progress"><div id="bar" style="width: 30%"></div></div>
  </div>

  <div class="section hidden" id="settings">
    <h3>Options</h3>
    <label><input type="checkbox" id="outlines"> Include text outlines (fallback for missing fonts)</label>
    <label>Pixels per point <input type="number" id="pxPerPt" min="0.01" max="100" step="0.01" style="width: 70px"></label>
  </div>

  <div class="section">
    <h3>Last push</h3>
    <div class="summary hidden" id="summary"></div>
    <div class="muted" id="noPush">Nothing sent yet.</div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/cep.js"></script>
  <script src="js/panel-common.js"></script>
  <script src="panel.js"></script>
</body>
</html>
