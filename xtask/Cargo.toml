[package]
name = "xtask"
description = "Pulley build tasks: `cargo xtask icons` renders, packs and validates every icon."
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
# SVG rendering (no raster image decoders needed; system fonts for placeholder labels).
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }
# Windows .ico and macOS .icns writers/readers.
ico = "0.6"
icns = "0.5"
# Reading PNGs back for validation.
png = "0.18"

[lints]
workspace = true
